[project]
name = "ecg-visualization"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Key5n", email = "k.nogami.472@stn.nitech.ac.jp" }
]
requires-python = ">=3.13"
dependencies = [
    "biosppy>=2.2.4",
    "networkx>=3.5",
    "numpy>=2.3.3",
    "optuna>=4.6.0",
    "pandas>=2.3.3",
    "peakutils>=1.3.5",
    "pymysql>=1.1.2",
    "pypdf>=6.3.0",
    "python-dotenv>=1.2.1",
    "scikit-learn>=1.5.2",
    "seaborn>=0.13.2",
    "tqdm>=4.67.1",
    "wfdb>=4.3.0",
]


[tool.uv]
cache-dir = ".uv_cache"

[dependency-groups]
dev = [
    "ruff>=0.15.20",
]

[tool.ruff.lint]
extend-select = ["I"]
